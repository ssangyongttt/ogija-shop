<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오기자 마켓 — 릴스 속 그 상품</title>
<meta name="description" content="오기자 릴스에서 소개한 상품 모음">
<style>
  :root {
    --bg:#F4F1EA; --panel:#FFFFFF; --ink:#171B20; --mute:#6E7684;
    --accent:#C4544B; --accent-ink:#fff; --line:#E3DED2; --chip:#EEE9DE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#171B20; --panel:#1E242B; --ink:#F2EFE9; --mute:#8C96A3;
      --accent:#F0A6A0; --accent-ink:#171B20; --line:#2E353D; --chip:#242B33;
    }
  }
  * { margin:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink);
         font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         max-width:520px; margin:0 auto; padding:0 18px 56px; }
  a { text-decoration:none; }

  .disclosure { font-size:11.5px; color:var(--mute); text-align:center;
                 padding:10px 6px 0; line-height:1.5; }

  header { text-align:center; padding-top:26px; }
  .avatar { width:158px; height:158px; border-radius:50%;
             object-fit:cover;
             box-shadow:0 10px 34px rgba(0,0,0,.28); }
  .onair { display:inline-flex; align-items:center; gap:6px;
            background:var(--accent); color:var(--accent-ink);
            font-size:11px; font-weight:800; letter-spacing:1.5px;
            padding:4px 12px; border-radius:999px; margin-top:14px; }
  .onair .dot { width:6px; height:6px; border-radius:50%;
                 background:currentColor; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  header h1 { font-size:30px; letter-spacing:-1px; margin-top:10px; }
  header .handle { color:var(--mute); font-size:13px; margin-top:2px; }
  header .tag { font-size:14.5px; margin-top:10px; line-height:1.6; }

  .section { margin-top:30px; }
  .section > h2 { font-size:13px; font-weight:800; letter-spacing:2px;
                   color:var(--mute); margin-bottom:12px;
                   display:flex; align-items:center; gap:10px; }
  .section > h2::after { content:""; flex:1; height:1px;
                          background:var(--line); }


  .card { background:var(--panel); border:1px solid var(--line);
           border-radius:16px; padding:15px 16px; margin-bottom:11px;
           display:flex; align-items:center; gap:14px;
           box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .card .txt { flex:1; min-width:0; }
  .card .name { font-weight:700; font-size:15.5px; line-height:1.4; }
  .card .date { color:var(--mute); font-size:12px; margin-top:3px; }
  .card a { flex-shrink:0; background:var(--accent); color:var(--accent-ink);
             font-size:13.5px; font-weight:700; padding:10px 15px;
             border-radius:11px; }
  .empty { background:var(--panel); border:1px dashed var(--line);
            border-radius:16px; text-align:center; color:var(--mute);
            padding:34px 16px; font-size:13.5px; line-height:1.8; }

  .igbtn { display:flex; align-items:center; justify-content:center;
            gap:8px; background:var(--ink); color:var(--bg);
            font-size:15px; font-weight:700; border-radius:14px;
            padding:15px; margin-top:26px; }
  footer { text-align:center; color:var(--mute); font-size:11px;
            margin-top:14px; line-height:1.7; }
  .visits { text-align:center; color:var(--mute); font-size:12px;
             margin-top:22px; }
  .visits img { height:18px; vertical-align:middle; opacity:.85; }
</style>
</head>
<body>
<p class="disclosure">이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<header>
  <img class="avatar" src="profile.png" alt="오기자 로고">
  <div><span class="onair"><span class="dot"></span>오늘도 영업 중</span></div>
  <h1>오기자 마켓</h1>
  <div class="handle">@total_ogija</div>
  <p class="tag"><b>세상은 넓고, 핫템은 많다!</b><br>
     오기자가 실시간 트렌드를 읽고 <b>직접 선별한 상품만</b> 진열합니다</p>
</header>

<div class="section">
  <h2>🛒 오늘의 트렌드 진열대</h2>
  <div class="card">
  <div class="txt">
    <div class="name">지보르 국산 아이스 쿨 스카프 1+1, 오션블루</div>
    <div class="date">07/31 릴스에서 소개</div>
  </div>
  <a href="https://link.coupang.com/a/fO7IyQQHUi" rel="nofollow sponsored">쿠팡에서 보기</a>
</div>
</div>

<a class="igbtn" href="https://www.instagram.com/total_ogija">인스타그램에서 릴스 보기 →</a>
<div class="visits">오늘 <b id="v-today">–</b> · 누적 <b id="v-total">–</b> 방문</div>
<footer>세상은 넓고, 핫템은 많다!<br>오기자 마켓 · @total_ogija</footer>
<script data-goatcounter="https://ogija.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  var base = "https://ogija.goatcounter.com/counter/";
  function put(id, n) { var el = document.getElementById(id);
    if (el && n != null) el.textContent = n; }
  function get(url, cb) { fetch(url).then(function (r) { return r.json(); })
    .then(function (d) { cb(d.count); }).catch(function () {}); }
  var path = encodeURIComponent(location.pathname);
  var today = new Date().toISOString().slice(0, 10);
  get(base + path + ".json", function (n) { put("v-total", n); });
  get(base + path + ".json?start=" + today, function (n) { put("v-today", n); });
  // 상품 버튼 클릭을 이벤트로 남긴다 — 어떤 상품이 클릭되는지가
  // 진열 유지/회전의 근거가 된다.
  document.querySelectorAll(".card a").forEach(function (a) {
    a.addEventListener("click", function () {
      if (window.goatcounter && goatcounter.count)
        goatcounter.count({ path: "click-" + a.closest(".card")
          .querySelector(".name").textContent.trim().slice(0, 40),
          event: true });
    });
  });
})();
</script>
</body>
</html>
